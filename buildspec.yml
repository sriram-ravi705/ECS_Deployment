version: 0.2
phases:
  pre_build:
    commands:
      # Get Dockerfile
      - aws s3 cp s3://pythonappdockerfile0509/Dockerfile .
      # Get OTEL install script (downloads binary + writes its own config + service entry)
      - aws s3 cp s3://pythonappdockerfile0509/otel/install-otel.sh .
      # Append OTEL install step into Dockerfile
      - echo "" >> Dockerfile
      - echo "# OpenTelemetry Collector" >> Dockerfile
      - echo "COPY install-otel.sh /tmp/install-otel.sh" >> Dockerfile
      - echo "RUN apk add --no-cache wget && chmod +x /tmp/install-otel.sh && /tmp/install-otel.sh && rm /tmp/install-otel.sh" >> Dockerfile
      - echo "" >> Dockerfile
      - echo "# OTEL Metrics Port" >> Dockerfile
      - echo "EXPOSE 8889" >> Dockerfile
      # Login to ECR
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 228998978698.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - docker build -t python/app .
      - docker tag python/app:latest 228998978698.dkr.ecr.us-east-1.amazonaws.com/python/app:latest
  post_build:
    commands:
      - docker push 228998978698.dkr.ecr.us-east-1.amazonaws.com/python/app:latest
      - printf '[{"name":"pythonapp","imageUri":"228998978698.dkr.ecr.us-east-1.amazonaws.com/python/app:latest"}]' > imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
